<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MCT — Projet UVCI</title>
<style>
  body { font-family: Arial, sans-serif; background:#eee; padding:20px; margin:0; }
  h1   { text-align:center; font-size:20px; color:#333; margin-bottom:4px; }
  p.sub{ text-align:center; color:#666; font-size:13px; margin-bottom:24px; }
  h3   { font-size:14px; color:#444; border-left:4px solid #CC8800;
         padding-left:10px; margin:30px auto 10px; max-width:620px; }
  svg  { display:block; margin:0 auto 30px; background:#fff;
         border:1px solid #bbb; border-radius:6px;
         box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .btn { display:block; margin:20px auto 40px; padding:10px 28px;
         background:#CC8800; color:#fff; border:none; border-radius:5px;
         font-size:14px; cursor:pointer; }
  .btn:hover { background:#aa6600; }
  @media print { .btn { display:none; } }
</style>
</head>
<body>
<h1>Modèle Conceptuel de Traitements (MCT)</h1>
<p class="sub">Système de gestion des heures pédagogiques — UVCI</p>

<!-- ─── LÉGENDE ──────────────────────────────────────────── -->
<svg width="620" height="50">
  <ellipse cx="70"  cy="25" rx="60" ry="18" fill="#AACCFF" stroke="#0055AA" stroke-width="1.5"/>
  <text x="70"  y="29" text-anchor="middle" font-size="11" font-family="Arial">Événement</text>
  <rect x="145" y="8" width="110" height="34" fill="#FFFF99" stroke="#CC8800" stroke-width="1.5" rx="3"/>
  <text x="200" y="29" text-anchor="middle" font-size="11" font-family="Arial">Opération</text>
  <ellipse cx="340" cy="25" rx="80" ry="18" fill="#BBEECC" stroke="#007700" stroke-width="1.5"/>
  <text x="340" y="29" text-anchor="middle" font-size="11" font-family="Arial">Résultat positif</text>
  <ellipse cx="510" cy="25" rx="80" ry="18" fill="#FFBBBB" stroke="#AA0000" stroke-width="1.5"/>
  <text x="510" y="29" text-anchor="middle" font-size="11" font-family="Arial">Résultat négatif</text>
</svg>

<!-- ═══════════════════════════════════════════════════════════
     PROCESSUS 1 — Déclaration d'une activité pédagogique
════════════════════════════════════════════════════════════ -->
<h3>Processus 1 — Déclaration d'une activité pédagogique</h3>
<svg width="620" height="550">
<defs>
  <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#555"/>
  </marker>
</defs>

<!-- Events -->
<ellipse cx="170" cy="42" rx="155" ry="26" fill="#AACCFF" stroke="#0055AA" stroke-width="2"/>
<text x="170" y="39" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Enseignant authentifié</text>
<text x="170" y="54" text-anchor="middle" font-size="10" font-family="Arial" fill="#333">(Déclencheur 1)</text>

<ellipse cx="450" cy="42" rx="155" ry="26" fill="#AACCFF" stroke="#0055AA" stroke-width="2"/>
<text x="450" y="39" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Formulaire d'activité soumis</text>
<text x="450" y="54" text-anchor="middle" font-size="10" font-family="Arial" fill="#333">(Déclencheur 2)</text>

<!-- Arrows events → op box -->
<line x1="200" y1="68" x2="295" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="420" y1="68" x2="325" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Operation box -->
<rect x="20" y="100" width="580" height="330" fill="#FFFF99" stroke="#CC8800" stroke-width="2" rx="4"/>
<rect x="20" y="100" width="580" height="30"  fill="#FFD700" stroke="#CC8800" stroke-width="2" rx="4"/>
<text x="310" y="120" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#333">
  Opération : Enregistrement de l'activité pédagogique
</text>
<line x1="20" y1="130" x2="600" y2="130" stroke="#CC8800" stroke-width="1"/>

<!-- Steps -->
<text x="40" y="155" font-size="11" font-family="Arial" fill="#333">1.  Vérification de l'existence de l'enseignant dans le système</text>
<line x1="50" y1="162" x2="50" y2="174" stroke="#555" stroke-width="1.2" marker-end="url(#a1)"/>
<text x="40" y="192" font-size="11" font-family="Arial" fill="#333">2.  Vérification de l'existence du cours dans le référentiel</text>
<line x1="50" y1="199" x2="50" y2="211" stroke="#555" stroke-width="1.2" marker-end="url(#a1)"/>
<text x="40" y="229" font-size="11" font-family="Arial" fill="#333">3.  Récupération du coefficient selon le type et le niveau de complexité</text>
<line x1="50" y1="236" x2="50" y2="248" stroke="#555" stroke-width="1.2" marker-end="url(#a1)"/>
<text x="40" y="266" font-size="11" font-family="Arial" fill="#333">4.  Calcul automatique du volume horaire  =  nombre de séquences  x  coefficient</text>
<line x1="50" y1="273" x2="50" y2="285" stroke="#555" stroke-width="1.2" marker-end="url(#a1)"/>
<text x="40" y="303" font-size="11" font-family="Arial" fill="#333">5.  Création de la ressource pédagogique associée au cours</text>
<line x1="50" y1="310" x2="50" y2="322" stroke="#555" stroke-width="1.2" marker-end="url(#a1)"/>
<text x="40" y="340" font-size="11" font-family="Arial" fill="#333">6.  Enregistrement de l'activité avec le statut initial : En attente de validation</text>
<line x1="50" y1="347" x2="50" y2="359" stroke="#555" stroke-width="1.2" marker-end="url(#a1)"/>
<text x="40" y="377" font-size="11" font-family="Arial" fill="#333">7.  Notification au responsable de validation</text>

<!-- Arrows op box → results -->
<line x1="200" y1="430" x2="170" y2="468" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="420" y1="430" x2="450" y2="468" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Results -->
<ellipse cx="170" cy="500" rx="158" ry="28" fill="#BBEECC" stroke="#007700" stroke-width="2"/>
<text x="170" y="497" text-anchor="middle" font-size="11" font-family="Arial" font-weight="bold">Activité créée</text>
<text x="170" y="512" text-anchor="middle" font-size="10" font-family="Arial">En attente de validation</text>

<ellipse cx="450" cy="500" rx="158" ry="28" fill="#FFBBBB" stroke="#AA0000" stroke-width="2"/>
<text x="450" y="497" text-anchor="middle" font-size="11" font-family="Arial" font-weight="bold">Erreur signalée</text>
<text x="450" y="512" text-anchor="middle" font-size="10" font-family="Arial">Données invalides ou incomplètes</text>
</svg>

<!-- ═══════════════════════════════════════════════════════════
     PROCESSUS 2 — Validation d'une activité
════════════════════════════════════════════════════════════ -->
<h3>Processus 2 — Validation d'une activité par l'administration</h3>
<svg width="620" height="470">
<defs>
  <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#555"/>
  </marker>
</defs>

<!-- Events -->
<ellipse cx="170" cy="42" rx="155" ry="26" fill="#AACCFF" stroke="#0055AA" stroke-width="2"/>
<text x="170" y="39" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Activité au statut En attente</text>
<text x="170" y="54" text-anchor="middle" font-size="10" font-family="Arial" fill="#333">(Déclencheur 1)</text>

<ellipse cx="450" cy="42" rx="155" ry="26" fill="#AACCFF" stroke="#0055AA" stroke-width="2"/>
<text x="450" y="39" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Décision prise par le validateur</text>
<text x="450" y="54" text-anchor="middle" font-size="10" font-family="Arial" fill="#333">(Déclencheur 2)</text>

<!-- Arrows events → op box -->
<line x1="200" y1="68" x2="295" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>
<line x1="420" y1="68" x2="325" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>

<!-- Operation box -->
<rect x="20" y="100" width="580" height="245" fill="#FFFF99" stroke="#CC8800" stroke-width="2" rx="4"/>
<rect x="20" y="100" width="580" height="30"  fill="#FFD700" stroke="#CC8800" stroke-width="2" rx="4"/>
<text x="310" y="120" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#333">
  Opération : Validation de l'activité pédagogique
</text>
<line x1="20" y1="130" x2="600" y2="130" stroke="#CC8800" stroke-width="1"/>

<!-- Steps -->
<text x="40" y="155" font-size="11" font-family="Arial" fill="#333">1.  Consultation de la liste des activités en attente de validation</text>
<line x1="50" y1="162" x2="50" y2="174" stroke="#555" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="40" y="192" font-size="11" font-family="Arial" fill="#333">2.  Examen du détail de l'activité sélectionnée (enseignant, cours, volume horaire)</text>
<line x1="50" y1="199" x2="50" y2="211" stroke="#555" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="40" y="229" font-size="11" font-family="Arial" fill="#333">3.  Mise à jour du statut de l'activité : Validée ou Rejetée</text>
<line x1="50" y1="236" x2="50" y2="248" stroke="#555" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="40" y="266" font-size="11" font-family="Arial" fill="#333">4.  Enregistrement de la date de décision et de l'identifiant du validateur</text>
<line x1="50" y1="273" x2="50" y2="285" stroke="#555" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="40" y="303" font-size="11" font-family="Arial" fill="#333">5.  Mise à jour du tableau de bord des activités traitées</text>

<!-- Arrows op box → results -->
<line x1="200" y1="345" x2="170" y2="385" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>
<line x1="420" y1="345" x2="450" y2="385" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>

<!-- Results -->
<ellipse cx="170" cy="418" rx="158" ry="28" fill="#BBEECC" stroke="#007700" stroke-width="2"/>
<text x="170" y="415" text-anchor="middle" font-size="11" font-family="Arial" font-weight="bold">Activité validée</text>
<text x="170" y="430" text-anchor="middle" font-size="10" font-family="Arial">Volume horaire comptabilisé</text>

<ellipse cx="450" cy="418" rx="158" ry="28" fill="#FFBBBB" stroke="#AA0000" stroke-width="2"/>
<text x="450" y="415" text-anchor="middle" font-size="11" font-family="Arial" font-weight="bold">Activité rejetée</text>
<text x="450" y="430" text-anchor="middle" font-size="10" font-family="Arial">Non comptabilisée</text>
</svg>

<!-- ═══════════════════════════════════════════════════════════
     PROCESSUS 3 — Génération des états de paiement
════════════════════════════════════════════════════════════ -->
<h3>Processus 3 — Génération des états de paiement et calcul de la rémunération</h3>
<svg width="620" height="590">
<defs>
  <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#555"/>
  </marker>
</defs>

<!-- Event (single) -->
<ellipse cx="310" cy="42" rx="280" ry="26" fill="#AACCFF" stroke="#0055AA" stroke-width="2"/>
<text x="310" y="46" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">
  Demande d'export pour une année académique
</text>

<!-- Arrow event → op box -->
<line x1="310" y1="68" x2="310" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a3)"/>

<!-- Operation box -->
<rect x="20" y="100" width="580" height="375" fill="#FFFF99" stroke="#CC8800" stroke-width="2" rx="4"/>
<rect x="20" y="100" width="580" height="30"  fill="#FFD700" stroke="#CC8800" stroke-width="2" rx="4"/>
<text x="310" y="120" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#333">
  Opération : Calcul de la rémunération et génération de l'export
</text>
<line x1="20" y1="130" x2="600" y2="130" stroke="#CC8800" stroke-width="1"/>

<!-- Steps -->
<text x="40" y="155" font-size="11" font-family="Arial" fill="#333">1.  Sélection de toutes les activités au statut Validé pour l'année demandée</text>
<line x1="50" y1="162" x2="50" y2="174" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="192" font-size="11" font-family="Arial" fill="#333">2.  Regroupement des activités par enseignant</text>
<line x1="50" y1="199" x2="50" y2="211" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="229" font-size="11" font-family="Arial" fill="#333">3.  Calcul du volume horaire total validé par enseignant</text>
<line x1="50" y1="236" x2="50" y2="248" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="266" font-size="11" font-family="Arial" fill="#333">4.  Récupération du quota statutaire selon le grade et le statut de l'enseignant</text>
<line x1="50" y1="273" x2="50" y2="285" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="303" font-size="11" font-family="Arial" fill="#333">5.  Calcul des heures supplémentaires  =  Volume total validé  -  Quota statutaire</text>
<line x1="50" y1="310" x2="50" y2="322" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="340" font-size="11" font-family="Arial" fill="#333">6.  Calcul de la rémunération  =  Heures supplémentaires  x  Taux horaire</text>
<line x1="50" y1="347" x2="50" y2="359" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="377" font-size="11" font-family="Arial" fill="#333">7.  Génération et mise à disposition du fichier Excel récapitulatif</text>
<line x1="50" y1="384" x2="50" y2="396" stroke="#555" stroke-width="1.2" marker-end="url(#a3)"/>
<text x="40" y="414" font-size="11" font-family="Arial" fill="#333">8.  Archivage de la demande d'export dans le journal du système</text>

<!-- Arrows op box → results -->
<line x1="200" y1="475" x2="170" y2="515" stroke="#555" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="420" y1="475" x2="450" y2="515" stroke="#555" stroke-width="1.5" marker-end="url(#a3)"/>

<!-- Results -->
<ellipse cx="170" cy="548" rx="158" ry="28" fill="#BBEECC" stroke="#007700" stroke-width="2"/>
<text x="170" y="545" text-anchor="middle" font-size="11" font-family="Arial" font-weight="bold">Fichier d'état de paiement généré</text>
<text x="170" y="560" text-anchor="middle" font-size="10" font-family="Arial">Disponible au téléchargement</text>

<ellipse cx="450" cy="548" rx="158" ry="28" fill="#FFBBBB" stroke="#AA0000" stroke-width="2"/>
<text x="450" y="545" text-anchor="middle" font-size="11" font-family="Arial" font-weight="bold">Export impossible</text>
<text x="450" y="560" text-anchor="middle" font-size="10" font-family="Arial">Aucune activité validée trouvée</text>
</svg>

<button class="btn" onclick="window.print()">Imprimer / Exporter en PDF</button>
</body>
</html>
