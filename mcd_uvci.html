<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MCD — Projet UVCI</title>
<style>
  body { font-family: Arial, sans-serif; background: #eee; padding: 20px; }
  h1 { text-align:center; font-size:20px; color:#333; margin-bottom:4px; }
  p  { text-align:center; color:#666; font-size:13px; margin-bottom:20px; }
  svg { display:block; margin:0 auto; background:#fff;
        border:1px solid #bbb; border-radius:6px;
        box-shadow:0 3px 12px rgba(0,0,0,.18); }
  .btn { display:block; margin:16px auto 0; padding:10px 28px;
         background:#CC8800; color:#fff; border:none; border-radius:6px;
         font-size:14px; cursor:pointer; }
  .btn:hover { background:#aa6600; }
  @media print { .btn { display:none; } }
</style>
</head>
<body>
<h1>Modèle Conceptuel de Données (MCD)</h1>
<p>Système de gestion des heures pédagogiques — UVCI</p>

<svg id="svg" width="1260" height="720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .eb  { fill:#FFFF99; stroke:#CC8800; stroke-width:2; }
    .eh  { fill:#FFD700; stroke:#CC8800; stroke-width:2; }
    .et  { font:bold 12px Arial; fill:#333; text-anchor:middle; }
    .ea  { font:11px Arial; fill:#333; text-anchor:start; }
    .eu  { font:11px Arial; fill:#333; text-anchor:start; text-decoration:underline; }
    .ae  { fill:#00CCCC; stroke:#006666; stroke-width:2; }
    .at  { font:bold 11px Arial; fill:#004444; text-anchor:middle; dominant-baseline:middle; }
    .cl  { stroke:#444; stroke-width:1.5; fill:none; }
    .ct  { font:bold 10px Arial; fill:#CC0000; }
    .sep { stroke:#CC8800; stroke-width:1; }
  </style>
</defs>

════════════════════════════════════════════════ -->

<!-- COURS ↕ CONTIENT ↕ RESSOURCE -->

<line class="cl" x1="575" y1="321" x2="575" y2="375"/>

<!-- ENSEIGNANT → PRODUIT → RESSOURCE -->

<line class="cl" x1="400" y1="468" x2="475" y2="430"/>

<!-- RESSOURCE → CONCERNE → ACTIVITE -->

<line class="cl" x1="860" y1="450" x2="960" y2="455"/>

<!-- ANNEE ↕ REGROUPE ↕ ACTIVITE -->

<line class="cl" x1="1100" y1="318" x2="1090" y2="375"/>

<line class="cl" x1="690" y1="618" x2="1030" y2="545"/>

════════════════════════════════════════════════ -->
