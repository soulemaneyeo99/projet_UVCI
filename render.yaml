services:
  - type: web
    name: gestionheures-uvci-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Origines autorisées pour CORS (CSV). À renseigner avec l'URL Vercel du frontend
      # une fois le déploiement effectué (ex: https://gestionheures-uvci.vercel.app).
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
